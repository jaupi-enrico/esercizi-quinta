<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form di acquisto</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <form id="formAcquisto">
        <label for="prodotto">Prodotto</label>
        <input type="text" id="prodotto" required>
        <br>
        <label for="prezzo">Prezzo</label>
        <input type="number" id="prezzo" min="0.01" step="0.01" required>
        <br>
        <label for="quantita">Quantità</label>
        <input type="number" id="quantita" min="1" step="1" required>
        <br>
        <button type="submit">Aggiungi</button>
    </form>

    <table id="tabellaProdotti">
        <thead>
            <tr>
                <th>Prodotto</th>
                <th>Prezzo</th>
                <th>Quantità</th>
                <th>Subtotale</th>
                <th>Sconto</th>
                <th>Totale</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="corpoTabella"></tbody>
    </table>

    <p id="risultato"></p>

    <script src="index.js"></script>
</body>
</html>
